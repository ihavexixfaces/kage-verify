<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090c">
  <title>KAGE Verification Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient"></div>
  <main class="verify-shell">
    <section class="verify-card" aria-labelledby="verify-title">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">K</div>
        <div>
          <span class="eyebrow">KAGE ACCESS</span>
          <h1 id="verify-title">Verify with Discord</h1>
        </div>
      </div>

      <p class="lead">Sign in with Discord to verify your KAGE access. No slash command or six-digit code is required.</p>

      <div class="status-card" id="status-card" data-state="idle">
        <span class="status-dot"></span>
        <div>
          <strong id="status-title">Ready to verify</strong>
          <small id="status-copy">Your verification session will expire automatically.</small>
        </div>
      </div>

      <button class="discord-button" id="verify-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 8.4c1.2-.9 2.6-1.2 3.8-1.2s2.6.3 3.8 1.2c1.1 1.7 1.7 3.5 1.8 5.4-1.2 1.4-2.5 2.1-3.8 2.5l-.8-1.1c.8-.2 1.5-.6 2.2-1.1-2 1-4.3 1.2-6.4.4-.7-.2-1.4-.5-2-.9.7.5 1.5.9 2.3 1.1l-.8 1.1c-1.4-.4-2.7-1.1-3.9-2.5.1-1.9.7-3.7 1.8-5.4.7-.3 1.4-.6 2-.7Z"/><circle cx="9.4" cy="12.1" r="1"/><circle cx="14.6" cy="12.1" r="1"/></svg>
        <span>Verify with Discord</span>
      </button>

      <div class="identity-card hidden" id="identity-card">
        <img id="identity-avatar" alt="Discord avatar">
        <div>
          <span>VERIFIED DISCORD USER</span>
          <strong id="identity-name">—</strong>
          <small id="identity-id">ID —</small>
        </div>
      </div>

      <div class="technical-row">
        <span>Prototype</span>
        <span>GitHub Pages + Cloudflare Worker</span>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
